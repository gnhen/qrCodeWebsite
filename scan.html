<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A free, secure, and fast QR code scanner. Scan any QR code images easily on our safe QR code website. 100% free with no ads.">
    <meta name="keywords" content="qr code scanner, qr code website, qr code reader online, qr code no ads, qr code free">
    <meta property="og:title" content="Free QR Code Scanner | No Ads">
    <meta property="og:description" content="Quickly and securely scan your QR codes and images. 100% no ads and completely free.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="icon.png">
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <title>Free QR Code Scanner | No Ads QR Code Website</title>
    <style>
        * {
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        .upload-container {
            margin: 20px 0;
            padding: 20px;
            border: 2px dashed #ccc;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            min-height: 100px;
        }

        #previewImage {
            max-width: 100%;
            max-height: 300px;
            display: none;
            margin: 10px auto;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <a href="https://granthendricks.com" style="position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: black; font-weight: 900; font-size: 24px;">
        <img src="icon.png" alt="gnhen logo" style="width: 50px; height: 50px; border-radius: 5px; object-fit: contain;">
        Designed by gnhen
    </a>
    <h1>Free QR Code Scanner</h1>
    <p style="font-size: 0.9rem; color: #555;">No ads, completely free QR code website</p>
    <a href="index.html" style="text-decoration: none; color: #007bff; font-weight: bold; margin-bottom: 10px; display: inline-block;">Go back to the Free QR Code Maker</a>

    <div class="upload-container" id="uploadContainer">
        <p>Click here to upload a QR code image or drag and drop it</p>
        <input type="file" id="fileInput" accept="image/*" class="hidden">
    </div>

    <img id="previewImage" alt="QR Code Preview">

    <div id="result">
        <p>Decoded data will appear here...</p>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <!-- Include jsQR library -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <script>
        const uploadContainer = document.getElementById('uploadContainer');
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');
        const resultDiv = document.getElementById('result');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Handle click on the upload container
        uploadContainer.addEventListener('click', () => {
            fileInput.click();
        });

        // Handle drag and drop
        uploadContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadContainer.style.borderColor = '#000';
        });

        uploadContainer.addEventListener('dragleave', () => {
            uploadContainer.style.borderColor = '#ccc';
        });

        uploadContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadContainer.style.borderColor = '#ccc';

            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        // Handle file selection
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) {
                handleFile(fileInput.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.match('image.*')) {
                resultDiv.innerHTML = '<p>Error: Please upload an image file.</p>';
                return;
            }

            const reader = new FileReader();

            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewImage.style.display = 'block';

                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if (code) {
                        resultDiv.innerHTML = `
                            <p><strong>QR Code detected!</strong></p>
                            <p><strong>Data:</strong> ${escapeHtml(code.data)}</p>
                        `;
                    } else {
                        resultDiv.innerHTML = '<p>No QR code found in the image. Please try another image.</p>';
                    }
                };

                img.src = e.target.result;
            };

            reader.readAsDataURL(file);
        }

        // Helper function to escape HTML
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>

</html>
